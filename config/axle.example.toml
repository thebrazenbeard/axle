[server]
host = "127.0.0.1"
port = 8787
ui_dir = "ui"

[ai]
llm_base_url = "http://127.0.0.1:8080"
llm_model = "local"
llm_timeout_seconds = 30.0
allow_cloud_fallback = false

[safety]
# Prototype/dev only. Production must derive motion from a trusted vehicle or
# navigation signal and must fail closed to "unknown" when that signal is lost.
motion_state = "parked"
