[server]
host = "127.0.0.1"
port = 8787
ui_dir = "ui"

[ai]
llm_base_url = "http://127.0.0.1:8080"
llm_model = "local"
llm_timeout_seconds = 30.0
allow_cloud_fallback = false

[safety]
# Fail closed by default. For a stationary bench/demo only, copy this file to
# config/axle.local.toml and explicitly set motion_state = "parked".
motion_state = "unknown"
