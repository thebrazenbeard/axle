[server]
host = "127.0.0.1"
port = 8787
ui_dir = "ui"

[ai]
llm_base_url = "http://127.0.0.1:8080"
llm_model = "local"
llm_timeout_seconds = 30.0
allow_cloud_fallback = false

[safety]
# Fail closed by default. Use "parked" only for a stationary bench/demo unless
# a trusted vehicle telemetry source is providing current motion state.
motion_state = "unknown"

[voice]
enabled = false
work_dir = "/var/lib/axle/voice"
stt_model = ""
tts_model = ""
command_timeout_seconds = 120.0
# Commands are argument arrays. AXLE never joins these into a shell string.
capture_command = [
  "pw-record", "--rate=16000", "--channels=1", "--format=s16", "{wav}"
]
stt_command = [
  "whisper-cli", "-m", "{model}", "-f", "{wav}", "-otxt", "-of", "{out}", "-nt"
]
tts_command = [
  "python3", "-m", "piper", "-m", "{model}", "-f", "{wav}", "--", "{text}"
]
playback_command = ["pw-play", "{wav}"]
